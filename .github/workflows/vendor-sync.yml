name: Vendor sync
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vendor-sync
  cancel-in-progress: false
jobs:
  vendor-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync upstream
        id: sync
        run: |
          export HOME="$RUNNER_TEMP/pao-vendor-home"
          mkdir -p "$HOME"
          result=$(bin/pao vendor-sync)
          printf '%s\n' "$result"
          summary=$(printf '%s\n' "$result" | awk '$2 == "changed" {printf "%s%s %s -> %s", sep, $1, $3, $5; sep = ", "}')
          if [ -n "$summary" ]; then
            printf 'changed=true\nsummary=%s\n' "$summary" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate and test
        if: steps.sync.outputs.changed == 'true'
        run: |
          export HOME="$RUNNER_TEMP/pao-vendor-home"
          export XDG_STATE_HOME="$HOME/state"
          bin/pao check
          tests/pao-test.sh
      - name: Commit vendor update
        if: steps.sync.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor
          git commit -m "chore(vendor): $SUMMARY"
          git push origin HEAD:main
