name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update && sudo apt-get install -y shellcheck ;;
              macOS) brew install shellcheck ;;
              Windows) choco install shellcheck --yes --no-progress ;;
            esac
          fi
      - run: shellcheck --severity=warning skills/felix-mode/scripts/pstack-refs tests/pstack-refs-test.sh bin/pao tests/pao-test.sh skills/felix-mode/scripts/codex-run skills/felix-mode/scripts/laptop-guard skills/felix-mode/scripts/merge-guard skills/felix-mode/scripts/store-guard tests/felix-mode-scripts-test.sh configs/claude/hooks/duplicate-session-guard tests/duplicate-session-guard-test.sh
      - name: Validate and test
        run: |
          export HOME="$RUNNER_TEMP/pao-check-home"
          export XDG_STATE_HOME="$HOME/state"
          mkdir -p "$HOME"
          bin/pao check
          tests/pstack-refs-test.sh
          tests/pao-test.sh
          tests/felix-mode-scripts-test.sh
          tests/duplicate-session-guard-test.sh
