name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update && sudo apt-get install -y shellcheck ;;
              macOS) brew install shellcheck ;;
              Windows) choco install shellcheck --yes --no-progress ;;
            esac
          fi
      - run: shellcheck --severity=warning skills/felix-mode/scripts/pstack-refs tests/pstack-refs-test.sh bin/pao tests/pao-test.sh skills/felix-mode/scripts/codex-run skills/felix-mode/scripts/laptop-guard skills/felix-mode/scripts/merge-guard skills/felix-mode/scripts/store-guard skills/felix-mode/scripts/risk-classify skills/felix-mode/scripts/apto-vigente tests/felix-mode-scripts-test.sh configs/claude/hooks/duplicate-session-guard tests/duplicate-session-guard-test.sh fleet/deskpolicy/deploy-desk.sh fleet/deskpolicy/withdraw-desk.sh fleet/gha-runner/instalar.sh fleet/gha-runner/solo-main.sh bin/pao-worktree tests/pao-worktree-test.sh
      - name: Reject test cases run as an if condition
        run: |
          if grep -rnE 'if[[:space:]]+!?[[:space:]]*\(set -e' tests fleet skills configs bin; then
            echo '::error::Un caso ejecutado como condición de if ignora set -e. Usa: (set -e; caso) > log; result=$?; if [ "$result" = 0 ]; then ...'
            exit 1
          fi
      - name: Test pao-worktree
        if: runner.os != 'Windows'
        run: tests/pao-worktree-test.sh
      - name: Test deskpolicy retirement (MacBook/Linux transport)
        if: runner.os != 'Windows'
        run: python3 -I -m unittest discover -s fleet/deskpolicy/tests -v
      - name: Test Mini GitHub Actions runner installer
        if: runner.os != 'Windows'
        run: python3 -I -m unittest discover -s fleet/gha-runner/tests -v
      - name: Test pueue-vigilante
        if: runner.os != 'Windows'
        run: |
          python3 -I -m unittest discover -s fleet/pueue-vigilante/tests -v
          if [ "$RUNNER_OS" = macOS ]; then
            /usr/bin/python3 --version
            /usr/bin/python3 -I -m unittest discover -s fleet/pueue-vigilante/tests -v
          fi
      - name: Validate and test
        run: |
          export HOME="$RUNNER_TEMP/pao-check-home"
          export XDG_STATE_HOME="$HOME/state"
          mkdir -p "$HOME"
          bin/pao check
          tests/pstack-refs-test.sh
          tests/pao-test.sh
          tests/felix-mode-scripts-test.sh
          tests/duplicate-session-guard-test.sh
  tren:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Test tren (Python default and macOS system 3.9)
        run: |
          export HOME="$RUNNER_TEMP/pao-tren-home"
          export XDG_STATE_HOME="$HOME/state"
          export XDG_CONFIG_HOME="$HOME/config"
          export XDG_DATA_HOME="$HOME/data"
          export XDG_CACHE_HOME="$HOME/cache"
          mkdir -p "$HOME"
          git version
          python3 --version
          python3 -I -m unittest discover -s fleet/tren/tests -v
          if [ "$RUNNER_OS" = macOS ]; then
            /usr/bin/python3 --version
            /usr/bin/python3 -I -m unittest discover -s fleet/tren/tests -v
          fi
