<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rack de pruebas</title><style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1b1b19; --ink2:#55554f; --muted:#8a8981;
  --line:#e4e2da; --track:#ecebe5; --accent:#2f6fd6; --accent-track:#dde7f8;
  --good:#0ca30c; --warn:#c98a00; --crit:#d03b3b; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141413; --panel:#1c1c1b; --ink:#ecebe6; --ink2:#b4b3ab; --muted:#7c7b74;
  --line:#2c2c2a; --track:#2a2a28; --accent:#6c9ef0; --accent-track:#24324a;
  --good:#2fbf2f; --warn:#fab219; --crit:#e65a5a; }}
:root[data-theme="dark"]{
  --bg:#141413; --panel:#1c1c1b; --ink:#ecebe6; --ink2:#b4b3ab; --muted:#7c7b74;
  --line:#2c2c2a; --track:#2a2a28; --accent:#6c9ef0; --accent-track:#24324a;
  --good:#2fbf2f; --warn:#fab219; --crit:#e65a5a; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:baseline;gap:16px;padding:20px 24px 8px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:600;letter-spacing:-.01em}
.when{color:var(--muted);font-size:13px}
.switch{margin-left:auto;display:flex;gap:4px}
.refresh{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);padding:4px 10px;border-radius:6px;cursor:pointer}
.refresh:disabled{color:var(--muted);cursor:default}
.switch button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);padding:4px 10px;border-radius:6px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:8px 24px 40px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
/* host */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;align-items:start}
.host{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.host h2{font-size:16px;margin:0 0 2px;font-weight:600}
.state{font-size:12px;display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.cap{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0 6px}
.m-label{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:6px}
.m-val{font-size:18px;font-weight:600;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:var(--track);position:relative;overflow:visible}
.meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.meter .tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.6}
.m-note{font-size:12px;margin-top:6px}
h3{font-size:12px;font-weight:600;color:var(--ink2);margin:18px 0 6px}
.run{padding:10px 0;border-top:1px solid var(--line)}
.run:first-of-type{border-top:0}
.r-top{display:flex;gap:8px;align-items:baseline}
.r-ticket{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-title{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.r-sub{display:flex;gap:10px;font-size:12px;color:var(--ink2);margin:3px 0 6px}
.bar{height:6px;border-radius:3px;background:var(--accent-track);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.bar.over>i{background:var(--warn)}
.r-time{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.queue{list-style:none;margin:0;padding:0}
.queue li{display:grid;grid-template-columns:22px 82px 1fr auto;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.queue li:first-child{border-top:0}
.queue .pos{color:var(--muted);font-variant-numeric:tabular-nums}
.queue .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{font-size:12px;color:var(--muted);padding-top:6px}
/* C: lugares */
.lanes{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.lane{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:center}
.lane .g{font-size:12px;color:var(--ink2)}
.slots{display:grid;gap:6px}.slots>*{min-width:0;overflow:hidden}.stack{display:flex;flex-direction:column;gap:16px}
.slot{border:1px dashed var(--line);border-radius:8px;min-height:54px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.slot.busy{border:1px solid var(--line);background:var(--bg)}
.slot .r-top{font-size:13px}
.slot.empty{color:var(--muted);font-size:12px;align-items:center}
.waiting{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
@media (max-width:560px){header,main{padding-left:16px;padding-right:16px}.cols{grid-template-columns:1fr}.cap{grid-template-columns:1fr 1fr 1fr;gap:8px}}

@media(max-width:560px){.lane{grid-template-columns:1fr}.slots{grid-template-columns:1fr!important}.r-sub{flex-wrap:wrap;gap:4px 10px}.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}.m-val{font-size:16px}.m-label{flex-wrap:wrap}.host{padding:12px}.cap{gap:8px}}
.r-sub span,.g{overflow-wrap:anywhere;min-width:0} #connection{color:var(--warn);padding:0 24px;font-size:13px} #connection:empty{display:none}
.fila{margin:2px 0 6px}
.fila h4{font-size:12px;font-weight:600;color:var(--ink2);margin:6px 0 2px}
.fila ol{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fila li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;column-gap:10px;row-gap:2px;padding:8px 10px;border-top:1px solid var(--line);background:var(--panel)}
.fila li:first-child{border-top:0}
.fila .pos{grid-row:1/3;align-self:center;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.fila .l1{display:flex;gap:8px;min-width:0;font-size:13px}
.fila .tk{font-weight:600;white-space:nowrap}
.fila .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fila .l2{grid-column:2/4;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);min-width:0}
.fila .l2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.fila .d{font-size:12px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.fila .more{display:block;width:100%;font:inherit;font-size:12px;color:var(--ink2);background:var(--bg);border:0;border-top:1px solid var(--line);padding:6px;cursor:pointer}
.slot.busy{position:relative}
.dots{font:inherit;font-size:14px;line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;margin-left:auto;order:9}
.fila .d{display:flex;gap:8px;align-items:baseline;justify-content:flex-end}
.act{font-size:12px;color:var(--ink2)}
.act.warn::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px}
.menu{position:absolute;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;min-width:190px}
.menu button{display:block;width:100%;text-align:left;font:inherit;font-size:13px;border:0;background:none;color:var(--ink);padding:7px 10px;border-radius:5px;cursor:pointer}
.menu button:hover{background:var(--bg)}
.usage{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:18px;font-size:13px;color:var(--ink)}
.usage caption{text-align:left;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.usage th,.usage td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.usage thead th{font-size:12px;font-weight:600;color:var(--ink2)}
.usage th:first-child{width:44%;padding-left:0}
.usage tbody th{font-weight:400;overflow-wrap:anywhere}
.usage-label{display:block;color:var(--ink2);font-size:12px}
.usage-meter{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:6px;align-items:center}
.usage-number{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.usage .outside .bar>i{background:var(--muted)}
.usage-note{font-size:12px;color:var(--ink2);margin:8px 0 0}
@media(max-width:560px){.usage th:first-child{width:40%}.usage th,.usage td{padding:7px 3px}.usage-meter{grid-template-columns:minmax(0,1fr) 43px;gap:4px}}

#toast:empty{display:none}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.menu button.danger{color:var(--crit)}
.menu button:disabled{color:var(--muted);cursor:default}
.menu .reason{font-size:12px;color:var(--ink2);padding:2px 10px 8px;max-width:280px;margin:0}
.pending{outline:1px solid var(--warn);outline-offset:-1px}
.action-state{color:var(--warn);font-size:12px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:18px;max-width:380px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog p{margin:0 0 14px;font-size:14px}
dialog .row{display:flex;gap:8px;justify-content:flex-end}
dialog button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
dialog button.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.lane{grid-template-columns:150px minmax(0,1fr)}
.step{display:inline-flex;align-items:center;gap:8px;margin-top:4px;position:relative}
.step button{font:inherit;font-size:13px;line-height:1;width:44px;height:44px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:5px;cursor:pointer;padding:0}
.step button:disabled{opacity:.35;cursor:default}
.step b{min-width:34px;text-align:center;font-weight:500;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.slot-help{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.step:focus .slot-help,.step:focus-within .slot-help{position:absolute;left:0;top:100%;width:280px;max-width:calc(100vw - 80px);height:auto;clip-path:none;overflow:visible;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;z-index:6;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.step:focus{outline:2px solid var(--accent);outline-offset:2px}
#toast button{font:inherit;border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer}
@media(max-width:560px){.lane{grid-template-columns:1fr}.step button{width:44px;height:44px}.step{gap:8px}}
</style></head><body><header><h1>Rack de pruebas</h1><span class="when" id="when"></span><button type="button" class="refresh" id="refresh">Actualizar</button></header><div id="connection" role="status"></div><main id="app"></main><div id="toast" role="status"></div><dialog id="confirm" aria-labelledby="confirm-text"><p id="confirm-text"></p><div class="row"><button type="button" value="no">No</button><button type="button" value="si" class="danger">Cancelar corrida</button></div></dialog><script>
let S, NOW;
const PENDING = new Map();
const CANCELLED = new Set();
const runKey = (h,t) => JSON.stringify([h.id,t.id,t.control?.ref,t.enqueued,t.start]);
const actionKey = (h,t) => h.id+'/'+t.id;
const pendingText = (h,t) => { const a=PENDING.get(actionKey(h,t)); return a ? `<span class="action-state" role="status">${esc(a.status==='unknown' ? 'Resultado desconocido · consultando…' : a.status==='cancel_unconfirmed' ? 'Cancelación sin confirmar · consultando…' : 'Cancelando…')}</span>` : ''; };
const pendingClass = (h,t) => PENDING.has(actionKey(h,t)) ? 'pending' : '';
function persistActions(){try{sessionStorage.setItem('rack-actions',JSON.stringify([...PENDING]));}catch{}}
try{for(const [key,a] of JSON.parse(sessionStorage.getItem('rack-actions') || '[]')){PENDING.set(key,a);}}catch{}
try{for(const key of JSON.parse(sessionStorage.getItem('rack-cancelled') || '[]')) CANCELLED.add(key);}catch{}

const GB = b => b == null ? NaN : (b/1024**3);
const fmtMin = s => `${Math.floor(s/60)} min`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const what = t => t.title || t.subject || t.branch || objective(t);
// Nombre de producto por carpeta, repo o proyecto de Linear; igual con o sin ticket.
const PRODUCT = {'comprador':'Hasito','hasito':'Hasito','sen-checkin':'Jale','jale':'Jale','personal-agent-orchestration':'PAO','felix-agent-engineering':'PAO','marhbe':'MARHBE','apotheca':'Bodega'};
const proj = t => { const p = (t.project || t.linear_project || t.group || '').replace(/\.+$/, ''); return PRODUCT[p.toLowerCase()] || p.charAt(0).toUpperCase() + p.slice(1); };
const OBJ = {contract:'Contrato',e2e:'E2E','api-unit':'Unitarias API','web-unit':'Unitarias web',types:'Tipos',gates:'Gates completos',launch:'Arranque',lint:'Lint','packages-build':'Build de paquetes'};
const objective = t => {
  if (!t.name) return 'sin nombre';
  if (OBJ[t.name]) return OBJ[t.name];
  const m = t.name.match(/^(suite|dirigida|repro|diag)-(.*)$/);
  return m ? `${m[1][0].toUpperCase()+m[1].slice(1)} · ${m[2]}` : t.name;
};
function zone(h){
  const per = h.load?.[0]/h.cores;
  if (!Number.isFinite(per)) return {per:0,c:'var(--muted)',label:'Sin lectura de CPU'};
  if (per < 1) return {per, c:'var(--good)', label:'Con capacidad libre'};
  if (per <= 2) return {per, c:'var(--warn)', label:'Llena, las pruebas pasan'};
  return {per, c:'var(--crit)', label:'Saturada, habrá timeouts'};
}
function hostState(h){
  if (!h.fresh) return `<span class="state">Sin datos desde hace ${h.age == null ? '—' : Math.floor(h.age/60)} min</span>`;
  if (h.guard && h.guard.action === 'pausar') return `<span class="state"><span class="dot" style="background:var(--warn)"></span>Admisión pausada por la guardia</span>`;
  const anyPaused = Object.values(h.groups).some(g => g.status === 'Paused');
  if (anyPaused) return `<span class="state"><span class="dot" style="background:var(--warn)"></span>Admisión pausada</span>`;
  return `<span class="state"><span class="dot" style="background:var(--good)"></span>Admitiendo corridas</span>`;
}
const groups = h => Object.entries(h.groups).filter(([n,g]) => h.id==='mini' || n !== 'default' || h.tasks.some(t => t.group === n && t.state !== 'Done'));
const running = h => h.tasks.filter(t => t.state === 'Running' || t.state === 'Paused').sort((a,b)=>a.start-b.start);
const queued = h => h.tasks.filter(t => t.state === 'Queued').sort((a,b)=>b.priority-a.priority || a.id-b.id);
const slotsTotal = h => groups(h).reduce((a,[,g])=>a+g.slots,0);

function capacity(h){
  const z = zone(h), used = h.mem_total - h.mem_avail, memPct = used/h.mem_total;
  const run = running(h).length, tot = slotsTotal(h);
  const loadPct = Math.min(z.per/3,1);
  return `<div class="cap">
    <div><div class="m-label"><span>CPU</span><span class="muted">${esc(h.cores ?? '—')} núcleos</span></div>
      <div class="m-val">${z.per.toFixed(1)} <span class="muted" style="font-size:12px;font-weight:400">por núcleo</span></div>
      <div class="meter" title="Carga ${Number.isFinite(h.load?.[0]) ? h.load[0].toFixed(1) : '—'} sobre ${esc(h.cores ?? '—')} núcleos"><i style="width:${loadPct*100}%;background:${z.c}"></i><span class="tick" style="left:33.3%"></span><span class="tick" style="left:66.6%"></span></div>
      <div class="m-note ink2">${z.label}</div></div>
    <div><div class="m-label"><span>Memoria</span><span class="muted">${Number.isFinite(GB(h.mem_total)) ? GB(h.mem_total).toFixed(0) : '—'} GB</span></div>
      <div class="m-val">${Number.isFinite(GB(h.mem_avail)) ? GB(h.mem_avail).toFixed(0) : '—'} GB <span class="muted" style="font-size:12px;font-weight:400">libres</span></div>
      <div class="meter"><i style="width:${memPct*100}%;background:${memPct>.85?'var(--crit)':'var(--accent)'}"></i></div>
      <div class="m-note ink2">Swap ${Number.isFinite(GB(h.swap_used)) ? GB(h.swap_used).toFixed(1) : '—'} de ${Number.isFinite(GB(h.swap_total)) ? GB(h.swap_total).toFixed(0) : '—'} GB</div></div>
    <div><div class="m-label"><span>Lugares</span><span class="muted">${tot} en total${h.control?.cap ? ' · tope '+h.control.cap : ''}</span></div>
      <div class="m-val">${run} <span class="muted" style="font-size:12px;font-weight:400">ocupados</span></div>
      <div class="meter"><i style="width:${tot?run/tot*100:0}%;background:var(--accent)"></i></div>
      <div class="m-note ink2">${queued(h).length ? queued(h).length + ' en fila' : 'Fila vacía'}</div></div>
  </div>`;
}
const fmtDur = s => s < 5400 ? `${Math.max(1,Math.round(s/60))} min` : `${(s/3600).toFixed(1)} h`;
// Un extremo si coinciden; la unidad una sola vez si ambos la comparten.
const span = e => { const lo = fmtDur(e.low), hi = fmtDur(e.high), [n, u] = lo.split(' ');
  return lo === hi ? hi : u === hi.split(' ')[1] ? `${n}–${hi}` : `${lo}–${hi}`; };
// La barra sólo sale con base: 5 corridas o más y un rango que no pase del triple de la mediana.
const known = t => t.est && t.est.n >= 5 && t.est.high <= 3 * t.est.typical;
function progress(t){
  const el = Math.max(0, NOW - (t.start ?? t.enqueued ?? NOW)), e = t.est;
  if (!known(t)) return {html:'', time: e ? `${fmtMin(el)} · suele tardar ${span(e)}` : fmtMin(el)};
  const over = el > e.high;
  return {html:`<div class="bar ${over?'over':''}"><i style="width:${Math.min(el/Math.max(1,e.high),1)*100}%"></i></div>`,
          time: over ? `${fmtMin(el)} · suele tardar ${span(e)}` : `${fmtMin(el)} de ~${fmtDur(e.typical)}`};
}
const OPEN = {};
const IDLE = 15*60;
function activity(t){
  const a = t.activity; if (!a) return '';
  const quiet = a.last == null ? null : Math.max(0, NOW - a.last);
  if (a.kind === 'verify') return `<div class="act warn">${esc('Servidores de verificación arriba, esperando que los suelten' + (quiet == null ? '' : ' · sin salida hace ' + fmtMin(quiet)))}</div>`;
  if (quiet != null && quiet > IDLE) return `<div class="act warn">${esc('Sin actividad hace ' + fmtMin(quiet))}</div>`;
  return '';
}
const dots = () => `<button type="button" class="dots" aria-label="${esc('Acciones')}" aria-expanded="false">${esc('⋯')}</button>`;
function fila(h, n, w){
  if (!w.length) return '';
  const key = h.id+'/'+n, shown = OPEN[key] ? w : w.slice(0, 8);
  return `<div class="lane"><div></div><div class="fila"><h4>Fila · ${w.length}</h4><ol data-host="${esc(h.id)}" data-group="${esc(n)}">${shown.map((t,i)=>`<li class="${pendingClass(h,t)}" data-id="${esc(t.id)}" aria-busy="${PENDING.has(actionKey(h,t))}">
    <span class="pos">${i+1}</span>
    <div class="l1"><span class="tk">${esc(t.ticket||'Sin ticket')}</span><span class="t" title="${esc(what(t))}">${esc(what(t))}</span></div>
    <span class="d">${known(t) ? '~'+esc(fmtDur(t.est.typical)) : ''}${dots()}</span>
    <div class="l2">${pendingText(h,t)}<span>${esc(proj(t))}</span><span>${esc(objective(t))}</span>${t.branch?`<span class="mono">${esc(t.branch)}</span>`:''}<span>en fila hace ${fmtMin(Math.max(0,NOW-(t.enqueued ?? NOW)))}</span></div>
  </li>`).join('')}</ol>${w.length>shown.length?`<button class="more" data-open="${esc(key)}">Ver ${w.length-shown.length} más</button>`:''}</div></div>`;
}

function resourceTable(h){
  const tasks = h.tasks.filter(t=>t.state==='Running');
  if (!h.usage || !tasks.length || !(h.cores>0) || !(h.mem_total>0)) return '';
  tasks.sort((a,b)=>(b.usage?.cpu ?? 0)-(a.usage?.cpu ?? 0) || (b.usage?.mem ?? 0)-(a.usage?.mem ?? 0));
  const cell = (value,total) => {
    if (!Number.isFinite(value)) return '<td>—</td>';
    const pct=value/total*100, digits=pct>0 && pct<1 ? 1 : 0;
    const text=pct>0 && pct<.05 ? '<0,1 %' : pct.toLocaleString('es',{minimumFractionDigits:digits,maximumFractionDigits:digits})+' %';
    return `<td><div class="usage-meter"><div class="bar" aria-hidden="true"><i style="width:${Math.min(100,Math.max(0,pct))}%"></i></div><span class="usage-number">${text}</span></div></td>`;
  };
  const row = (label,u,cls='') => `<tr class="${cls}"><th scope="row">${label}</th>${cell(u?.cpu,h.cores)}${cell(u?.mem,h.mem_total)}</tr>`;
  const note = h.usage.docker==='read' ? 'Incluye contenedores atribuibles.' : h.usage.docker==='error' ? 'Sin contenedores: Docker no respondió.' : 'Sin contenedores: Docker no está instalado.';
  return `<table class="usage"><caption>Consumo por corrida</caption><thead><tr><th scope="col">Corrida</th><th scope="col">CPU</th><th scope="col">RAM</th></tr></thead><tbody>${tasks.map(t=>row(`${t.ticket?`<strong>${esc(t.ticket)}</strong> · `:''}${esc(what(t))}<span class="usage-label">${esc(proj(t))} · ${esc(objective(t))} · ${esc(t.group)}</span>`,t.usage)).join('')}${row('Fuera de las corridas',h.usage.outside,'outside')}</tbody></table><p class="usage-note">Porcentajes del host completo. ${note}</p>`;
}

const HOST_CONFIRMED = new Map(), SLOT_MESSAGES = new Map();
const slotKey = h => '@host/'+h.id;
function slotControls(h,n,g,r){
  const c=h.control, a=PENDING.get(slotKey(h));
  const capable=h.id==='mini' && c?.capabilities?.slots===true && Object.hasOwn(c.slots,n);
  const common=!capable ? c?.reason || c?.error?.message || 'Falta actualizar el control de este host.' : !h.fresh ? 'Actualiza la instantánea antes de decidir.'
    : a ? 'Hay un ajuste pendiente; consulta su recibo.' : c.drift || c.recovery_pending ? 'Reconciliación pendiente.' : '';
  const total=capable ? Object.values(c.slots).reduce((a,n)=>a+n,0) : 0;
  const minus=common || (g.slots<=1 ? 'Mínimo de 1 lugar.' : '');
  const plus=common || (g.slots>=8 ? 'Máximo de 8 lugares.' : total>=c.cap ? `Tope de ${c.cap} lugares. Quita un lugar a otro grupo para añadirlo aquí.` : '');
  const count=g.slots;
  const usage=`${r}/${g.slots} en uso${r>g.slots ? ` · no entran nuevas hasta bajar de ${g.slots}` : ''}`;
  const name='slots-'+h.id+'-'+n;
  return `<div class="muted slot-usage">${esc(usage)}</div><div class="step" tabindex="0" data-slot-focus="${esc(h.id+'/'+n)}" aria-label="Lugares de ${esc(n)}" aria-describedby="${esc(name)}"><button type="button" data-step="-1" data-host="${esc(h.id)}" data-group="${esc(n)}" aria-label="Quitar un lugar a ${esc(n)}" title="${esc(minus || 'Quitar un lugar')}" ${minus?'disabled':''}>−</button><b>${esc(count)}</b><button type="button" data-step="1" data-host="${esc(h.id)}" data-group="${esc(n)}" aria-label="Añadir un lugar a ${esc(n)}" title="${esc(plus || 'Añadir un lugar')}" ${plus?'disabled':''}>+</button><span class="slot-help" id="${esc(name)}">${esc(plus || minus)}</span></div>`;
}
function hostControlState(h){
  const a=PENDING.get(slotKey(h)), c=h.control;
  let message=SLOT_MESSAGES.get(h.id) || (['recovery_error','busy'].includes(c?.status) ? c.error.message : '');
  if(a) message=a.status==='partial' ? 'Aplicado parcialmente · intentando completar' : a.status==='unknown' ? 'Resultado desconocido · consultando…' : 'Aplicando…';
  else if(c?.drift) message='Lugares observados distintos del ajuste guardado · reconciliación pendiente';
  else if(c?.recovery_pending) message='Reconciliación pendiente';
  const result=a?.result;
  const desired=result?.desired || c?.desired, observed=result?.observed || c?.slots;
  if((a?.status==='partial' || c?.drift) && desired){
    message+=' · '+Object.entries(desired).map(([g,n])=>`${g}: ${observed?.[g] ?? '—'} observado / ${n} deseado`).join(' · ');
  }
  if(c?.pause_reasons && Object.values(c.pause_reasons).some(r=>r.includes('ambiguous')))
    message+=(message?' · ':'')+'Pausa tras reinicio: resolver por SSH con control.py';
  return message ? `<p class="action-state" role="status">${esc(message)}</p>` : '';
}
function slotExpected(h){
  const c=h.control;
  return {revision:c.revision,policy_hash:c.policy_hash,generation:c.generation,mode:c.mode,slots:{...c.slots}};
}
function focusSlots(host,group){
  [...document.querySelectorAll('[data-slot-focus]')].find(e=>e.dataset.slotFocus===host+'/'+group)?.focus();
}
function startSlots(h,change,undoOf){
  if(PENDING.has(slotKey(h))) return;
  const request={schema:'rack-action@1',op:undoOf?'undo':'slots',host:h.id,action_id:newActionId(),dry_run:false,expected:slotExpected(h)};
  if(undoOf) request.undo_of=undoOf; else request.change=change;
  const action={request,status:'applying',group:change?.group};
  PENDING.set(slotKey(h),action);SLOT_MESSAGES.delete(h.id);persistActions();repaintActions();
  if(action.group) focusSlots(h.id,action.group);
  sendSlots(slotKey(h),action);
}
function acceptSlots(key,action,data){
  const h=S?.hosts.find(h=>h.id===action.request.host);
  if(['applying','partial','unknown'].includes(data.status)){
    action.status=data.status;action.result=data.result;persistActions();repaintActions();
    setTimeout(()=>pollAction(key,action),2000);return;
  }
  PENDING.delete(key);persistActions();
  if(data.status==='applied' && h && data.result?.observed){
    const c={...h.control,revision:data.revision,slots:{...data.result.observed},desired:{...data.result.desired},drift:false,recovery_pending:false};
    HOST_CONFIRMED.set(h.id,c);h.control=c;
    for(const [g,n] of Object.entries(c.slots)) if(h.groups[g]) h.groups[g].slots=n;
    SLOT_MESSAGES.delete(h.id);
    say(action.request.op==='undo' ? 'Lugares restaurados' : `${action.group}: ${c.slots[action.group]} lugares · hasta otro cambio manual`,
      action.request.op==='undo' ? null : ()=>{
        const current=S?.hosts.find(x=>x.id===h.id);
        if(current) startSlots(current,{group:action.group},action.request.action_id);
      });
  }else{
    SLOT_MESSAGES.set(action.request.host,data.error?.message || 'No se pudo confirmar el ajuste. Actualiza antes de decidir.');
    say(SLOT_MESSAGES.get(action.request.host));
  }
  repaintActions();if(action.group) focusSlots(action.request.host,action.group);refresh();
}
async function sendSlots(key,action){
  try{acceptSlots(key,action,await postAction(action.request));}
  catch{action.status='unknown';persistActions();repaintActions();setTimeout(()=>pollAction(key,action),2000);}
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-step]');
  if(!b || b.disabled) return;
  const h=S?.hosts.find(h=>h.id===b.dataset.host);
  if(h?.control?.capabilities?.slots) startSlots(h,{group:b.dataset.group,delta:Number(b.dataset.step)});
});

function view(){
    return `<div class="stack">${S.hosts.map(h=>{
      const lanes = groups(h).map(([n,g])=>{
        const r = h.tasks.filter(t=>t.group===n && ['Running','Paused'].includes(t.state)), w = queued(h).filter(t=>t.group===n);
        const cells = Array.from({length:Math.max(g.slots,r.length)},(_,i)=>{ const t=r[i]; if(!t) return `<div class="slot empty">Libre</div>`;
          const p=progress(t); return `<div class="slot busy ${pendingClass(h,t)}" aria-busy="${PENDING.has(actionKey(h,t))}" data-host="${esc(h.id)}" data-id="${esc(t.id)}"><div class="r-top">${dots()}<span class="r-ticket">${esc(t.ticket||'—')}</span><span class="r-title" title="${esc(what(t))}">${esc(what(t))}</span></div><div class="r-sub" style="margin:0"><span>${esc(proj(t))}</span><span>${esc(objective(t))}</span></div>${p.html}<div class="r-time">${t.state==='Paused' ? 'Pausada · ' : ''}${p.time}</div>${activity(t)}${pendingText(h,t)}</div>`;}).join('');
        return `<div class="lane"><div class="g">${esc(n)}${slotControls(h,n,g,r.length)}</div><div class="slots" style="grid-template-columns:repeat(${Math.min(g.slots,5)},minmax(0,1fr))">${cells}</div></div>
          ${fila(h,n,w)}`;
      }).join('');
      return `<section class="host"><h2>${esc(h.name)}</h2>${hostState(h)}${capacity(h)}${hostControlState(h)}<div class="lanes">${lanes}</div>${resourceTable(h)}</section>`;}).join('')}</div>`;
}
function render(data){
  NOW = data.now;
  S = {hosts:data.hosts.map(h=>{
    const s=h.snapshot || {};
    const confirmed=HOST_CONFIRMED.get(h.id);
    const control=confirmed && (!s.control || s.control.revision<confirmed.revision) ? confirmed : s.control;
    return {...h, control, guard:s.guard, usage:s.usage, cores:s.cpu?.cores, load:s.cpu?.load,
      mem_total:s.mem?.total, mem_avail:s.mem?.available, swap_used:s.mem?.swap_used, swap_total:s.mem?.swap_total,
      groups:Object.fromEntries((s.groups || []).map(g=>[g.name,{...g,slots:control?.slots?.[g.name] ?? g.slots}])),
      tasks:(s.tasks || []).filter(t=>!CANCELLED.has(runKey(h,t))).map(t=>({...t,title:data.tickets[t.ticket]?.title,linear_project:data.tickets[t.ticket]?.project,est:h.estimates[String(t.id)]}))};
  })};
  for(const a of PENDING.values()){
    const h=S.hosts.find(h=>h.id===a.request.host);
    if(h && a.task){
      const i=h.tasks.findIndex(t=>t.id===a.task.id);
      // Keep the observed row visible even when the worker becomes Done/Stashed.
      if(i<0) h.tasks.push(a.task); else h.tasks[i]=a.task;
    }
  }
  document.getElementById('app').innerHTML=view();
  syncMenu();
  document.getElementById('when').textContent='Instantánea de las '+new Date(NOW*1000).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
document.getElementById('app').addEventListener('click', event=>{
  const button = event.target.closest('button[data-open]');
  if (button) { OPEN[button.dataset.open] = true; document.getElementById('app').innerHTML = view(); syncMenu(); }
});
let menuTask = null, toastTimer;
function say(text,back){
  const toast = document.getElementById('toast');
  toast.innerHTML = esc(text)+(back ? '<button type="button">Deshacer</button>' : '');
  if(back) toast.querySelector('button').onclick=back;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toast.textContent='', 8000);
}
function findTask(el){
  const box = el.closest('[data-id]'), host = box.dataset.host || box.closest('ol').dataset.host;
  const h = S.hosts.find(x=>x.id===host); return {h, t:h.tasks.find(x=>String(x.id)===box.dataset.id)};
}
function reference({h,t}){
  const a = t.activity, parts = [`rack ${h.id}:${t.id}`, t.group, t.ticket || 'sin ticket', proj(t), objective(t)];
  if (t.branch) parts.push(t.branch);
  if (a?.ref) parts.push(a.ref);
  parts.push(t.state === 'Queued' ? `en fila hace ${fmtMin(Math.max(0,NOW-(t.enqueued ?? NOW)))}` : `corriendo ${fmtMin(Math.max(0,NOW-(t.start ?? NOW)))}` + (a?.last != null ? `, última salida hace ${fmtMin(Math.max(0,NOW-a.last))}` : ''));
  return parts.join(' · ');
}
function closeMenu(focus=false){
  const button = menuButton();
  document.querySelector('.menu')?.remove(); menuTask=null;
  button?.setAttribute('aria-expanded','false'); if(focus) button?.focus();
}
function menuButton(){
  if (!menuTask) return null;
  return [...document.querySelectorAll('.dots')].find(b=>{const {h,t}=findTask(b); return h.id===menuTask.host && t.id===menuTask.id;});
}
function syncMenu(){
  if (!menuTask) return;
  const button=menuButton(), menu=document.querySelector('.menu');
  if (!button || !menu) { closeMenu(); return; }
  button.setAttribute('aria-expanded','true');
  const r=button.getBoundingClientRect();
  menu.style.top=(window.scrollY+r.bottom+4)+'px';
  menu.style.left=Math.max(8,window.scrollX+r.right-190)+'px';
}
document.addEventListener('click', ev=>{
  const button=ev.target.closest('.dots');
  if(button){
    closeMenu(); const {h,t}=findTask(button); menuTask={host:h.id,id:t.id};
    const menu=document.createElement('div'); menu.className='menu';
    menu.innerHTML=`<button type="button">${esc('Copiar referencia')}</button><button type="button" data-cancel class="danger" disabled aria-describedby="cancel-reason">Cancelar…</button><p class="reason" id="cancel-reason"></p>`;
    prepareCancel(menu,{h,t});
    menu.querySelector('button').onclick=async ()=>{
      const current=menuButton(); if(!current) {closeMenu();return;}
      const text=reference(findTask(current)); closeMenu(true);
      try {
        if(navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
        else {
          const field=document.createElement('textarea'); field.value=text;
          field.style.position='fixed'; field.style.opacity='0'; document.body.appendChild(field);
          try { field.select(); if(!document.execCommand('copy')) throw Error('copy'); }
          finally { field.remove(); current.focus(); }
        }
        say('Copiado: '+text);
      } catch { say('No se pudo copiar'); }
    };
    document.body.appendChild(menu); syncMenu(); menu.querySelector('button').focus(); return;
  }
  if(!ev.target.closest('.menu') && !ev.target.closest('#refresh')) closeMenu();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape') closeMenu(true);});
window.addEventListener('resize',syncMenu);

function cancelReason({h,t}){
  if(PENDING.has(actionKey(h,t))) return 'Esta cancelación sigue pendiente; se consulta con el mismo ID.';
  return h.actions?.reason
    || (!h.fresh ? 'Actualiza la instantánea antes de cancelar.' : null)
    || t.control?.reason || (!t.control?.launcher ? 'Lanzador no reconocido; no se puede confirmar la cancelación.' : null);
}
function actionRequest({h,t},op){return {schema:'rack-action@1',op,host:h.id,launcher:t.control.launcher,ref:t.control.ref,expected:{...t.control.expected}};}
async function postAction(request){
  const response=await fetch('/api/accion',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','X-Rack-Action':'1'},body:JSON.stringify(request),signal:AbortSignal.timeout(request.host==='desk'?45000:15000)});
  const data=await response.json();
  if(data.schema!=='rack-action@1') throw Error('Respuesta inválida');
  return data;
}
async function prepareCancel(menu,found){
  const button=menu.querySelector('[data-cancel]'), reason=menu.querySelector('.reason');
  reason.textContent=cancelReason(found) || 'Comprobando si la corrida admite cancelación…';
  if(cancelReason(found)) return;
  try{
    const data=await postAction(actionRequest(found,'capabilities'));
    const enabled=data.capabilities?.[found.t.state==='Queued'?'queued':'running']===true;
    reason.textContent=enabled ? '' : data.error?.message || data.capabilities?.reason || 'No se pudo confirmar la capacidad. Vuelve a abrir el menú.';
    button.disabled=!enabled;
    button.onclick=()=>{closeMenu();confirmCancel(found);};
  }catch{reason.textContent='Error de red al comprobar la cancelación. Vuelve a abrir el menú.';}
}
function newActionId(){
  const bytes=new Uint8Array(16); crypto.getRandomValues(bytes);
  return [...bytes].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function focusTask({h,t}){
  [...document.querySelectorAll('.dots')].find(b=>{const f=findTask(b);return f.h.id===h.id && f.t.id===t.id;})?.focus();
}
function confirmCancel(found){
  const d=document.getElementById('confirm'), {h,t}=found;
  const request=actionRequest(found,'cancel'); // exactly the state the person saw
  d.querySelector('p').textContent=`¿Cancelar ${t.ticket || objective(t)} · ${objective(t)} en ${h.name}? La sesión que la espera la verá como cancelada.`;
  d.returnValue='no';
  d.onclose=()=>{
    if(d.returnValue==='si' && !PENDING.has(actionKey(h,t))){
      const key=actionKey(h,t), action={request:{...request,action_id:newActionId()},task:{...t},status:'cancelling'};
      PENDING.set(key,action); persistActions(); repaintActions(); focusTask(found); sendCancel(key,action);
    }else focusTask(found);
  };
  d.querySelectorAll('button').forEach(b=>b.onclick=()=>d.close(b.value)); d.showModal();
}
function repaintActions(){if(S){document.getElementById('app').innerHTML=view();syncMenu();}}
function actionMessage(data,action){
  const label=action.task?.ticket || objective(action.task || {});
  if(data.status==='cancelled') return `${label} cancelada`;
  if(data.status==='already_finished') return `${label} ya había terminado (salida ${data.result.exit}).`;
  if(data.status==='cancel_unconfirmed') return 'Cancelación sin confirmar: no se acreditó el fin de los procesos. Se conservan los recursos; seguimos consultando.';
  if(data.status==='unknown') return 'Resultado desconocido: la acción pudo ocurrir. Consultando con el mismo ID.';
  return data.error?.message || 'No se pudo confirmar la cancelación.';
}
function acceptAction(key,action,data){
  if(['slots','undo'].includes(action.request.op)) return acceptSlots(key,action,data);
  if(['cancelling','unknown','cancel_unconfirmed'].includes(data.status)){
    const changed=action.status!==data.status; action.status=data.status;
    persistActions(); repaintActions();
    if(changed && data.status!=='cancelling') say(actionMessage(data,action));
    setTimeout(()=>pollAction(key,action),2000);
  }else{
    PENDING.delete(key); persistActions();
    if(data.status==='cancelled'){
      const identity=runKey({id:action.request.host},action.task);
      CANCELLED.add(identity);
      try{sessionStorage.setItem('rack-cancelled',JSON.stringify([...CANCELLED]));}catch{}
      const h=S?.hosts.find(h=>h.id===action.request.host);
      if(h) h.tasks=h.tasks.filter(t=>runKey(h,t)!==identity);
    }
    repaintActions(); say(actionMessage(data,action)); refresh();
  }
}
async function sendCancel(key,action){
  try{acceptAction(key,action,await postAction(action.request));}
  catch{action.status='unknown';persistActions();repaintActions();say('Error de red: la cancelación pudo ocurrir. Consultando con el mismo ID.');setTimeout(()=>pollAction(key,action),2000);}
}
async function pollAction(key,action){
  if(!PENDING.has(key)) return;
  try{
    const response=await fetch('/api/accion/'+encodeURIComponent(action.request.action_id),{cache:'no-store',signal:AbortSignal.timeout(action.request.host==='desk'?45000:15000)});
    const data=await response.json();
    if(response.status===404 && data.schema==='rack-action@1' && data.action_id===action.request.action_id && !action.resent && action.request.op==='cancel'){
      action.resent=true; persistActions();
      await sendCancel(key,action); return;
    }
    const hostTerminal=['slots','undo'].includes(action.request.op) &&
      (response.status===409 && ['conflict','rejected','unsupported'].includes(data.status) ||
       response.status===403 && data.status==='rejected' && data.error?.code==='disabled' && data.effects===false);
    if(data.schema!=='rack-action@1' || data.action_id!==action.request.action_id || (!response.ok && !hostTerminal)) throw Error('status');
    acceptAction(key,action,data);
  }catch{const changed=action.status!=='unknown';action.status='unknown';persistActions();repaintActions();if(changed) say('Error de red o autorización al consultar. Resultado desconocido; se conserva el mismo ID.');setTimeout(()=>pollAction(key,action),5000);}
}
for(const [key,action] of PENDING) setTimeout(()=>pollAction(key,action),2000);
let last=null;
async function load(path, options, failure){
  try{
    const response=await fetch(path,{cache:'no-store',...options});
    if(!response.ok) throw Error('HTTP');
    // Una respuesta que llega tarde no reemplaza una instantánea más nueva.
    const data=await response.json(); if(!(data.now < NOW)) render(data); last=new Date();
    document.getElementById('connection').textContent='';
  }catch(error){
    document.getElementById('connection').textContent=last ? failure+' · último dato a las '+last.toLocaleTimeString('es-MX') : failure;
  }
}
const refresh = () => load('/api/rack.json', {signal:AbortSignal.timeout(10000)}, 'Sin respuesta del servidor');
document.getElementById('refresh').addEventListener('click', async ({currentTarget: button}) => {
  button.disabled = true; button.textContent = 'Actualizando…';
  await load('/api/refresh', {method:'POST', headers:{'X-Rack-Refresh':'1'}, signal:AbortSignal.timeout(45000)}, 'No se pudo actualizar');
  button.disabled = false; button.textContent = 'Actualizar';
});
refresh(); setInterval(refresh,15000);
</script></body></html>
